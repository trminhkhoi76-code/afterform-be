# LOCAL DEVELOPMENT ONLY. Production should use managed Postgres and a real secret manager.
name: afterform-local
services:
  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog_local
      POSTGRES_USER: afterform_catalog
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in .env}
    volumes:
      - catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afterform_catalog -d catalog_local"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  catalog-service:
    build:
      context: .
      dockerfile: deploy/docker/catalog.Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-db:5432/catalog_local
      SPRING_DATASOURCE_USERNAME: afterform_catalog
      SPRING_DATASOURCE_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in .env}
      AFTERFORM_CORS_ORIGINS: ${AFTERFORM_CORS_ORIGINS:-http://localhost:8137,https://trminhkhoi76-code.github.io}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      catalog-db:
        condition: service_healthy
    restart: unless-stopped

  commerce-service:
    build:
      context: .
      dockerfile: deploy/docker/commerce.Dockerfile
    ports:
      - "127.0.0.1:8082:8082"
    restart: unless-stopped

volumes:
  catalog-data:
