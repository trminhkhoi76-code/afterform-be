spring:
  application:
    name: afterform-commerce-service
  datasource:
    url: ${COMMERCE_DB_URL}
    username: ${COMMERCE_DB_USERNAME}
    password: ${COMMERCE_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${COMMERCE_DB_MAX_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: commerce
    table: flyway_schema_history
server:
  port: ${PORT:8082}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
