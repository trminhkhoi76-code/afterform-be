spring:
  application:
    name: afterform-catalog-service
  datasource:
    hikari:
      maximum-pool-size: ${CATALOG_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${CATALOG_DB_MIN_IDLE:1}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns schema; Hibernate must never create/update it.
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
server:
  port: ${PORT:8081}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
afterform:
  cors:
    allowed-origins: ${AFTERFORM_CORS_ORIGINS:http://localhost:8137,https://trminhkhoi76-code.github.io}
  media:
    # Remain disabled until Neon bucket and S3 credentials have been configured.
    enabled: ${AFTERFORM_MEDIA_ENABLED:false}
    bucket: ${AFTERFORM_MEDIA_BUCKET:afterform-media}
