spring:
  application:
    name: afterform-catalog-service

  # One source of runtime configuration: environment variables from Vercel/local Docker.
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${CATALOG_DB_MAX_POOL_SIZE:3}
      minimum-idle: ${CATALOG_DB_MIN_IDLE:0}
      connection-timeout: ${CATALOG_DB_CONNECTION_TIMEOUT:5000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    default-schema: public

server:
  # Vercel sets PORT=80; local Docker uses the default port 8081.
  port: ${PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

afterform:
  cors:
    allowed-origins: ${AFTERFORM_CORS_ORIGINS:http://localhost:8137,https://trminhkhoi76-code.github.io}
  media:
    enabled: ${AFTERFORM_MEDIA_ENABLED:false}
    bucket: ${AFTERFORM_MEDIA_BUCKET:afterform-media}
