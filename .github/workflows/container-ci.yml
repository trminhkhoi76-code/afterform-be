name: Container build validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local Compose topology
        run: docker compose --env-file .env.example config --quiet
      - name: Validate Vercel Container configuration
        run: |
          jq -e '.framework == "container"' vercel.json
          test -f Dockerfile.vercel
      - name: Build Vercel Catalog image
        run: docker build -f Dockerfile.vercel -t afterform/catalog-vercel:ci .
      - name: Build catalog image
        run: docker build -f deploy/docker/catalog.Dockerfile -t afterform/catalog-service:ci .
      - name: Build commerce image
        run: docker build -f deploy/docker/commerce.Dockerfile -t afterform/commerce-service:ci .
