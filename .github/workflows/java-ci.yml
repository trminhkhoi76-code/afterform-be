name: Java microservices CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Maven tests and package
        run: mvn -B -ntp clean verify
      - name: Confirm both independently executable jars
        run: |
          test -f catalog-service/target/catalog-service-0.1.0-SNAPSHOT.jar
          test -f commerce-service/target/commerce-service-0.1.0-SNAPSHOT.jar
