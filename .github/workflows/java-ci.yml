name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: catalog_ci
          POSTGRES_USER: catalog_ci
          POSTGRES_PASSWORD: catalog_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U catalog_ci -d catalog_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/catalog_ci
      SPRING_DATASOURCE_USERNAME: catalog_ci
      SPRING_DATASOURCE_PASSWORD: catalog_ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test catalog import planning
        run: node --test tests/*.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify main-only Vercel deploy policy
        run: jq -e '.framework == "container" and .git.deploymentEnabled.main == true and .git.deploymentEnabled["**"] == false' vercel.json
      - name: Build and test Java services
        run: mvn -B -ntp clean verify
