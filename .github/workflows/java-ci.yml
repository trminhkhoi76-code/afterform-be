name: Java microservices CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: catalog_ci
          POSTGRES_USER: catalog_ci
          POSTGRES_PASSWORD: catalog_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U catalog_ci -d catalog_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/catalog_ci
      SPRING_DATASOURCE_USERNAME: catalog_ci
      SPRING_DATASOURCE_PASSWORD: catalog_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Neon URI-to-JDBC adapter (no credentials)
        run: npm run test:neon
      - name: Verify Java build using requested npm run build
        run: npm run build
      - name: Confirm both independently executable jars
        run: |
          test -f catalog-service/target/catalog-service-0.1.0-SNAPSHOT.jar
          test -f commerce-service/target/commerce-service-0.1.0-SNAPSHOT.jar
